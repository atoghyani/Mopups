# azure-pipelines.yml
trigger:
  branches:
    include:
      - master
  tags:
    include:
      - '*'   # optional: run on any tag

pr:
  branches:
    include:
      - '*'

variables:
  BuildConfiguration: 'Release'
  PackOutput: '$(Build.ArtifactStagingDirectory)/packages'

  # 👇 Set your NuGet version here (examples):
  # PackageVersion: '1.2.$(Build.BuildId)'        # e.g., 1.2.12345
  # PackageVersion: '1.2.0-alpha.$(Build.BuildId)'# e.g., 1.2.0-alpha.12345
  # PackageVersion: '1.2.0'                       # fixed version
  PackageVersion: '1.2.$(Build.BuildId)-hotfix'

pool:
  vmImage: 'windows-latest'   # NuGetCommand@2 uses NuGet.exe; Windows is the smoothest path

steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: 'Use .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.403'

  - script: |
      dotnet workload install maui --ignore-failed-sources
    displayName: 'Install .NET MAUI workloads'

  # Restore workloads for this single project (correct path)
  - powershell: |
      $proj = "$(Build.SourcesDirectory)\Mopups\Mopups.Maui\Mopups.csproj"
      if (-not (Test-Path -LiteralPath $proj)) {
        Write-Host "Sources dir = $(Build.SourcesDirectory)"
        Write-Error "Expected project not found: $proj"
        Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName | Format-Table -AutoSize
        exit 1
      }
      Write-Host "Restoring workloads for $proj"
      dotnet workload restore "$proj"
    displayName: 'Workload restore (Mopups.csproj only)'

  - task: DotNetCoreCLI@2
    displayName: 'Build ($(BuildConfiguration))'
    inputs:
      command: 'build'
      projects: '**/Mopups.csproj'
      arguments: '--configuration $(BuildConfiguration)'

  - script: echo "Packing version $(PackageVersion)"
    displayName: 'Show package version'

  - task: DotNetCoreCLI@2
    displayName: 'Pack NuGet packages'
    inputs:
      command: 'pack'
      packagesToPack: '**/Mopups.csproj'           # pack project(s), not the solution
      configuration: '$(BuildConfiguration)'
      nobuild: true
      includesymbols: false
      versioningScheme: 'off'                      # let our -p:Version win
      packDirectory: '$(PackOutput)'
      arguments: >-
        --configuration $(BuildConfiguration)
        -p:Version=$(PackageVersion)

  # --- Your provided steps, combined ---

  - task: CopyFiles@2
    displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '**\*.nupkg'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'

  - task: NuGetCommand@2
    displayName: 'NuGet push to internal feed'
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: 'f64f6e16-0574-4b91-8d00-0c5742228fae/b4889b15-c3ca-4c10-862e-60121d68680c'
      allowPackageConflicts: true   # optional
